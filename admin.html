<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Admin Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172554}
header{background:#173f75;color:white;padding:18px}
header h2{margin:0}
.container{max-width:1000px;margin:auto;padding:16px}
.card{background:white;padding:20px;border-radius:14px;margin:12px 0;box-shadow:0 3px 12px #0001}
input,textarea,select,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccd5e0;font-size:16px}
button{background:#1764b5;color:white;border:0;font-weight:bold;cursor:pointer}
button:hover{opacity:.9}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.menu button{background:#e8f1ff;color:#174477}
.hidden{display:none}
.item{padding:12px;background:#f5f7fb;margin:8px 0;border-radius:8px}
.delete{background:#dc2626}
#login{max-width:420px;margin:50px auto}
</style>
</head>
<body>

<header>
<h2>🏫 Kolavalloor West LP School</h2>
<p>Admin Dashboard</p>
</header>

<div class="container">

<div id="login" class="card">
<h2>🔐 Admin Login</h2>
<input id="email" type="email" value="kolavalloorwestlpschool@gmail.com" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="loginMsg"></p>
</div>

<div id="dashboard" class="hidden">

<div class="card">
<h2>📱 Admin Dashboard</h2>
<p>Welcome, Administrator!</p>
<button onclick="logout()">Logout</button>
</div>

<div class="card">
<h3>Choose Section</h3>
<div class="menu">
<button onclick="openSection('notices')">📢 Notices</button>
<button onclick="openSection('events')">📅 Events</button>
<button onclick="openSection('achievements')">🏆 Achievements</button>
<button onclick="openSection('news')">📰 News</button>
<button onclick="openSection('teachers')">👩‍🏫 Teachers</button>
<button onclick="openSection('activities')">🎨 Activities</button>
<button onclick="openSection('academics')">📚 Academics</button>
<button onclick="openSection('studentCorner')">🧒 Student Corner</button>
<button onclick="openSection('admission')">🎓 Admission</button>
<button onclick="openSection('gallery')">🖼️ Gallery</button>
</div>
</div>

<div id="editor" class="card hidden">
<h2 id="sectionTitle">Section</h2>
<div id="formArea"></div>
<button onclick="saveData()">💾 Save / Publish</button>
<button onclick="loadData()">🔄 Refresh</button>
<div id="dataList"></div>
</div>

</div>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import { getStorage, ref, uploadBytes, getDownloadURL }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-storage.js";

/* Paste your existing Firebase configuration here */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

let currentSection = "";

onAuthStateChanged(auth, user => {
  if(user){
    document.getElementById("login").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
  }else{
    document.getElementById("dashboard").classList.add("hidden");
    document.getElementById("login").classList.remove("hidden");
  }
});

window.login = async function(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try{
    await signInWithEmailAndPassword(auth,email,password);
    document.getElementById("loginMsg").textContent="";
  }catch(error){
    document.getElementById("loginMsg").textContent="Login failed: "+error.message;
  }
};

window.logout = async function(){
  await signOut(auth);
};

window.openSection = function(section){
  currentSection = section;
  document.getElementById("editor").classList.remove("hidden");
  document.getElementById("sectionTitle").textContent=section.toUpperCase();

  if(section==="gallery"){
    document.getElementById("formArea").innerHTML=`
      <input id="title" placeholder="Photo title">
      <textarea id="description" placeholder="Description"></textarea>
      <input id="file" type="file" accept="image/*">
    `;
  }else{
    document.getElementById("formArea").innerHTML=`
      <input id="title" placeholder="Title / Name">
      <textarea id="description" placeholder="Details / Description"></textarea>
      <input id="date" type="date">
      <input id="className" placeholder="Class (if applicable)">
    `;
  }
  loadData();
};

window.saveData = async function(){
  try{
    let title=document.getElementById("title").value;
    let description=document.getElementById("description").value;
    let data={title,description,createdAt:serverTimestamp()};

    if(document.getElementById("date"))
      data.date=document.getElementById("date").value;

    if(document.getElementById("className"))
      data.className=document.getElementById("className").value;

    if(currentSection==="gallery"){
      const file=document.getElementById("file").files[0];
      if(!file){alert("Please choose a photo");return;}
      const fileRef=ref(storage,"gallery/"+Date.now()+"_"+file.name);
      await uploadBytes(fileRef,file);
      data.imageUrl=await getDownloadURL(fileRef);
    }

    await addDoc(collection(db,currentSection),data);
    alert("Saved successfully!");
    loadData();
  }catch(error){
    alert("Error: "+error.message);
  }
};

window.loadData = async function(){
  const list=document.getElementById("dataList");
  list.innerHTML="Loading...";
  try{
    const snap=await getDocs(collection(db,currentSection));
    list.innerHTML="";
    snap.forEach(item=>{
      const d=item.data();
      list.innerHTML+=`
      <div class="item">
        <b>${d.title||""}</b><br>
        ${d.description||""}<br>
        ${d.date||""}
        ${d.imageUrl?`<br><img src="${d.imageUrl}" style="width:100%;max-width:250px">`:""}
        <button class="delete" onclick="removeItem('${item.id}')">Delete</button>
      </div>`;
    });
  }catch(error){
    list.innerHTML="Could not load data: "+error.message;
  }
};

window.removeItem=async function(id){
  if(confirm("Delete this item?")){
    await deleteDoc(doc(db,currentSection,id));
    loadData();
  }
};
</script>
</body>

</html>
